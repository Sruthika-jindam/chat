<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In</title>
  <link rel="stylesheet" href="signin.css" />
</head>
<body>
  <!-- Text to display at the center with each word in a separate span -->
  <div class="welcome-text" id="welcomeText">
    <span class="word" style="animation-delay: 0s;">🤖</span>
    <span class="word" style="animation-delay: 0.4s;">MEET</span>
    <span class="word" style="animation-delay: 0.9s;">YOUR</span>
    <span class="word" style="animation-delay: 1.4s;">SMART</span>
    <span class="word" style="animation-delay: 1.9s;">ASSISTANCE!</span>
  </div>

  <div class="top-bar">
    <button class="sign-in-btn" id="signInBtn">Sign In</button>
  </div>
  <div class="center-content">
    <form class="signin-form" id="signinForm">
      <h2>Sign In</h2>
      <input type="text" placeholder="Username" required />
      <input type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
  </div>
  <script src="signin.js"></script>
</body>
</html>
